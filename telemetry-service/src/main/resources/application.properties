
spring.application.name=telemetry-service

server.port=8083

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/telemetry_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Feign
analysis.service.url=${ANALYSIS_SERVICE_URL:http://localhost:8082}

spring.cloud.openfeign.client.config.vehicle-analysis-service.connectTimeout=3000
spring.cloud.openfeign.client.config.vehicle-analysis-service.readTimeout=5000

# Actuator
management.endpoints.web.exposure.include=health,info

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.rdm.telemetry=INFO
