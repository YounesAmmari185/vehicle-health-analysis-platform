
spring.application.name=vehicle-analysis-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/analysis_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.cloud.openfeign.client.config.recall-service.connectTimeout=3000
spring.cloud.openfeign.client.config.recall-service.readTimeout=5000

recall.service.url=http://localhost:8090

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

logging.level.com.rdm.analysis=INFO
