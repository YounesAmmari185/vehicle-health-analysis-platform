
spring.application.name=vehicle-analysis-service

server.port=8082

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/analysis_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Recall API
recall.service.url=${RECALL_SERVICE_URL:http://localhost:8090}

spring.cloud.openfeign.client.config.recall-service.connectTimeout=3000
spring.cloud.openfeign.client.config.recall-service.readTimeout=5000

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.rdm.analysis=INFO
